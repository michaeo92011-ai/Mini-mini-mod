name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'

      - name: Descomprimir proyecto
        run: unzip -q MiniMini-Forge-1.12.2.zip -d work

      - name: Compilar (prueba varias versiones de Forge)
        working-directory: work/proj
        run: |
          for v in 2860 2859 2855 2847 2838; do
            echo "=== Probando Forge 14.23.5.$v ==="
            sed -i "s/version = \"1.12.2-14.23.5.[0-9]*\"/version = \"1.12.2-14.23.5.$v\"/" build.gradle
            if gradle setupCIWorkspace build --no-daemon; then
              echo "=== FUNCIONO con $v ==="
              exit 0
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: work/proj/build/libs/*.jar
