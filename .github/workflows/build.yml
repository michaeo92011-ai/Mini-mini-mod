name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'

      - name: Descomprimir proyecto
        run: unzip -q MiniMini-Forge-1.12.2.zip -d work

      - name: Compilar
        working-directory: work/proj
        run: gradle setupCIWorkspace build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: work/proj/build/libs/*.jar
